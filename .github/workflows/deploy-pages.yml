name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate data
        run: npm run data:validate

      - name: Check generated JSON Schema
        run: npm run data:schemas:check

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_LOWER=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          if [ "$REPO_NAME" = "TechCompetitionHub.github.io" ]; then
            export VITE_BASE_PATH="/"
            export SITE_URL="https://${OWNER_LOWER}.github.io"
          else
            export VITE_BASE_PATH="/${REPO_NAME}/"
            export SITE_URL="https://${OWNER_LOWER}.github.io/${REPO_NAME}"
          fi
          echo "Building ${REPO_NAME} with base ${VITE_BASE_PATH} and site ${SITE_URL}"
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
