name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, test, data and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Validate data
        run: npm run data:validate

      - name: Check generated JSON Schema
        run: npm run data:schemas:check

      - name: Build production bundle
        run: npm run build

      - name: Verify Pages fallback files
        run: |
          test -f dist/404.html
          test -f dist/.nojekyll
          test -f dist/sitemap.xml
          grep -q 'assets/' dist/index.html
