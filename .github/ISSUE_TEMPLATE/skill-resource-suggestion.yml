name: 技能或资源建议
description: 建议新增技能、练习任务或学习资源，或修正现有条目。
title: '[技能/资源] '
body:
  - type: markdown
    attributes:
      value: |
        > 技能等级使用 L0–L4 行为描述，不使用“精通”“大神”等抽象标签。
        > 资源只保存标题、简介与原始链接；不要上传未授权材料。

  - type: dropdown
    id: kind
    attributes:
      label: 建议类型
      options:
        - 新增技能
        - 修改技能定义/等级
        - 新增练习任务
        - 新增学习资源
        - 修正资源链接或访问条款
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: 技能或资源名称
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: 资源 URL（如适用）
      placeholder: https://...
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: 说明
      description: 技能定义、L0–L4 行为、任务产出与验收标准，或资源的适用场景。
    validations:
      required: true

  - type: input
    id: related_skills
    attributes:
      label: 关联技能 ID（如适用）
      placeholder: 例如：python-programming、embedded-c
    validations:
      required: false

  - type: dropdown
    id: free_status
    attributes:
      label: 资源访问状态
      options:
        - 免费
        - 部分免费
        - 付费
        - 未知
        - 不适用
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: 来源与访问日期
      description: 发布方、URL、访问日期与许可/访问条款。
      placeholder: 发布方 | https://... | 2026-11-01 | 免费访问，转载需遵守原站条款
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 确认
      options:
        - label: 资源链接真实可访问，不是占位地址。
          required: true
        - label: 任务包含可验证的产出物与验收标准。
          required: true
        - label: 我没有提交未授权材料或个人信息。
          required: true
